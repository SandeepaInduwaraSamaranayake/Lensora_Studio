name: Build Multi-Platform Installers

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from the GitHub web interface

jobs:
  build-and-package:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows-installer
          - os: macos-latest
            artifact-name: macos-installer
          - os: ubuntu-latest
            artifact-name: linux-installer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Set this to your required JDK version (e.g., 21, 22, 26)
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm

      - name: Ensure Maven Wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x mvnw || true

      - name: Run Packaging Script
        shell: pwsh
        run: .\package.ps1 -AppVersion "1.0.0"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: .dist/*
