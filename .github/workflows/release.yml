name: Build Multi-Platform Installers

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'  # Triggers automatic release when pushing tags like v1.0.0, v1.2.0, etc.
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from the GitHub web interface

# Required permissions for GitHub Actions to create releases
permissions:
  contents: write

jobs:
  build-and-package:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows-installer
          - os: macos-latest
            artifact-name: macos-installer
          - os: ubuntu-latest
            artifact-name: linux-installer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '26' # Set this to required JDK version (e.g., 21, 22, 26)
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm

      - name: Ensure Maven Wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x mvnw || true
      
      - name: Clean Version Tag
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver -or "${{ github.ref_type }}" -ne "tag") { $ver = "1.0.0" }
          Write-Output "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Run Packaging Script
        shell: pwsh
        run: .\package.ps1 -AppVersion "${{ steps.version.outputs.VERSION }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/
          if-no-files-found: error


  create-release:
      name: Create GitHub Release
      needs: build-and-package
      # Only create a release when running on a tag (e.g. v1.0.0) or when manually triggered
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Create release directory
          run: mkdir -p release-assets

        - name: Download all build artifacts
          uses: actions/download-artifact@v4
          with:
            path: release-assets
            pattern: '*-installer'
            merge-multiple: true

        - name: Display downloaded assets
          run: ls -lh release-assets/

        - name: Publish GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            files: release-assets/*
            tag_name: ${{ github.ref_name }}
            name: Release ${{ github.ref_name }}
            draft: false
            prerelease: false
            generate_release_notes: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}